name: Feature request
description: Propose a focused Nodebay improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please search existing requests first. Do not include private files, cookies, media, credentials, or sensitive filenames.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: File safety, privacy, and permission considerations
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I did not include private or identifying data.
          required: true

