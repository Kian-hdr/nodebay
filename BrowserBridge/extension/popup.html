<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <style>
      :root { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color-scheme: light dark; }
      body { width: 250px; margin: 0; padding: 14px; background: Canvas; color: CanvasText; }
      h1 { margin: 0 0 5px; font-size: 15px; }
      p { margin: 0 0 12px; color: GrayText; line-height: 1.35; }
      button { width: 100%; min-height: 30px; border: 0; border-radius: 7px; font: inherit; font-weight: 600; background: AccentColor; color: AccentColorText; }
      button:disabled { opacity: .5; }
      #status { min-height: 18px; margin-top: 9px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Nodebay Equalizer</h1>
    <p>Enable audio processing only for this tab. Audio stays on this Mac.</p>
    <button id="toggle" disabled>Checking tab…</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
