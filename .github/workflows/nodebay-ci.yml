name: Nodebay CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: nodebay-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Apple Silicon build and verification
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Install pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13.15

      - name: Install companion tools
        run: brew install ripgrep yt-dlp ffmpeg

      - name: Stage pinned CPython license
        run: |
          license="$RUNNER_TEMP/cpython-3.13.15-LICENSE"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/python/cpython/v3.13.15/LICENSE \
            --output "$license"
          echo "78b12c3a81360b357002334f0e70ea0e92eebf7a9b358805c03c48484945f3bb  $license" | shasum -a 256 --check

      - name: Validate repository and notices
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/generate_nodebay_notices.py --check
          python3 scripts/verify_repository.py
          zsh -n scripts/*.sh
          ruby -c Casks/nodebay.rb
          git status --short

      - name: Build and verify MarkItDown runtime
        env:
          PYTHON_COMMAND: ${{ env.pythonLocation }}/bin/python3
          PYTHON_LICENSE: ${{ runner.temp }}/cpython-3.13.15-LICENSE
        run: |
          ./scripts/build_markitdown_runtime.sh
          ./scripts/test_markitdown_runtime.sh

      - name: Test local downloader fixture
        run: ./scripts/test_downloader_local.sh

      - name: Clean Release build
        run: |
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/NodebayDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ensure generated artifacts remain untracked
        run: |
          if git status --porcelain --untracked-files=all | grep -E '(^|/)(build|DerivedData|markitdown-runtime|__pycache__)/|\.app/|\.dSYM/'; then
            echo "Generated build artifact is visible to Git"
            exit 1
          fi
